<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learning Kits</title>
<style>
:root{--bg:#E3F3FF;--ink:#15264D;--paper:#fff;--muted:#475A85;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Trebuchet MS',system-ui,sans-serif;font-size:18px;padding-inline:16px;padding-block:18px 40px}
[hidden]{display:none!important}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:2rem;line-height:1.1}
.sub{margin:0;color:var(--muted)}
#list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.kit{border:3px solid var(--ink);border-radius:22px;background:var(--paper);box-shadow:0 6px 0 var(--ink);padding:0;overflow:hidden;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column}
.kit:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.band{height:14px;background:var(--c)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kit b{font-size:1.35rem;line-height:1.15}
.kit span{color:var(--muted);font-size:1rem}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
#exitBox{position:fixed;inset:0;background:rgba(21,38,77,.7);display:grid;place-items:center;padding:16px;z-index:10}
.dlg{background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:22px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:16px;text-align:center}
.dlg h2{margin:0;font-size:1.6rem}
.dlg .btns{display:flex;flex-direction:column;gap:12px}
.dlg button{min-height:58px;border-radius:999px;border:3px solid var(--ink);font:inherit;font-weight:700;font-size:1.15rem;cursor:pointer;background:var(--paper);color:var(--ink)}
.dlg button.no{background:var(--ink);color:var(--bg)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Learning Kits</h1>
  <p class="sub" id="count">Loading...</p>
  <div id="list"></div>
</div>
<iframe id="frame" title="Learning kit" hidden></iframe>
<div id="exitBox" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="exitTitle">
    <h2 id="exitTitle">Exit the app?</h2>
    <div class="btns">
      <button class="no" id="exitNo">No, stay</button>
      <button id="exitYes">Yes, exit</button>
    </div>
  </div>
</div>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var frame=$('#frame'),pal=['#3F6FFF','#FF7A59','#12A58A','#E8A200','#9B55F0','#EB3F85'];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function openKit(k){frame.src='kits/'+encodeURIComponent(k.file);frame.hidden=false}
  function closeKit(){frame.hidden=true;frame.src='about:blank'}
  fetch('kits.json').then(function(r){return r.json()}).then(function(kits){
    $('#count').textContent=kits.length?kits.length+' kit'+(kits.length>1?'s':'')+'. Tap one to start.':'No kits yet. Add .html files to www/kits.';
    $('#list').innerHTML=kits.map(function(k,i){
      return '<button class="kit" data-i="'+i+'" style="--c:'+esc(k.color||pal[i%pal.length])+'"><div class="band"></div><div class="body"><b>'+esc(k.title)+'</b>'+(k.desc?'<span>'+esc(k.desc)+'</span>':'')+'</div></button>';
    }).join('');
    $('#list').onclick=function(e){var b=e.target.closest('.kit');if(b)openKit(kits[+b.getAttribute('data-i')])};
  }).catch(function(){$('#count').textContent='Could not load the kit list.'});
  var A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  var box=$('#exitBox');
  $('#exitNo').onclick=function(){box.hidden=true};
  $('#exitYes').onclick=function(){if(A&&A.exitApp)A.exitApp()};
  if(A&&A.addListener){A.addListener('backButton',function(){
    if(!box.hidden){box.hidden=true}
    else if(!frame.hidden){closeKit()}
    else{box.hidden=false}
  })}
})();
</script>
</body>
</html>
