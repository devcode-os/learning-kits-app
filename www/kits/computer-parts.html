<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Computer Parts Spelling</title>
<meta name="kit-desc" content="Learn, find and spell 6 computer parts">
<meta name="kit-color" content="#3F6FFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@700;800&display=swap">
<style>
/* Layout: one column, big tap targets. Home with 3 games, then Learn / Find it / Spell it screens.
   Single bright look by choice (a children's game); every colour is set explicitly. */
:root{
  --bg:#E3F3FF; --ink:#15264D; --paper:#FFFFFF; --muted:#475A85; --line:#B9D6EE;
  --good:#17895C; --bad:#D9482B;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Andika','Comic Sans MS','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.4;padding-inline:16px;padding-block:12px 40px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.05;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.top h1{font-size:1.5rem;flex:1;min-width:0}
.iconbtn{width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.iconbtn svg{width:26px;height:26px}
.stars{display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:4px 14px 4px 10px;font-family:var(--f-display);font-weight:800;font-size:1.4rem;flex:none}
.stars svg{width:26px;height:26px}

.lead{font-family:var(--f-display);font-weight:800;font-size:2.1rem;margin:0}
.sub{margin:0;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.mode{background:var(--t);border:3px solid var(--ink);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;box-shadow:0 6px 0 var(--ink);transition:transform .12s}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.mode svg{width:100%;height:110px}
.mode h2{font-size:1.7rem}
.mode span{color:var(--muted);font-size:1rem}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.chip{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}
.chip svg{width:100%;height:64px}

.stage{background:var(--paper);border:3px solid var(--ink);border-radius:28px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.pic{width:100%;max-width:340px;background:var(--t);border-radius:22px;padding:10px;border:3px solid var(--c)}
.pic svg{width:100%;height:auto;display:block}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile,.slot{width:clamp(44px,11.5vw,62px);height:clamp(54px,14vw,74px);border-radius:14px;display:grid;place-items:center;font-family:var(--f-body);font-weight:700;font-size:clamp(1.6rem,6vw,2.2rem)}
.tile{background:var(--t);border:3px solid var(--c);color:var(--ink);box-shadow:0 4px 0 var(--c);transition:transform .15s,background .15s}
.tile.on{transform:translateY(-10px) scale(1.15);background:var(--c)}
.slot{border:3px dashed var(--line);background:var(--bg);color:var(--ink)}
.slot.full{border:3px solid var(--c);background:var(--t);animation:pop .3s}
.say{font-size:1.15rem;margin:0;max-width:30ch}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{min-height:56px;padding:8px 22px;border-radius:999px;border:3px solid var(--ink);background:var(--paper);font-weight:700;font-size:1.1rem;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.main{background:var(--ink);color:var(--bg)}
.btn svg{width:24px;height:24px}
.btn[disabled]{opacity:.4;cursor:default}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%}
.thumb{background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:3px;min-width:0}
.thumb svg{width:100%;height:auto;display:block}
.thumb[aria-current="true"]{border-color:var(--ink);background:var(--t)}

.ask{font-family:var(--f-display);font-weight:800;font-size:2rem}
.ask b{background:var(--ink);color:var(--bg);border-radius:12px;padding:0 12px}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line);border:2px solid var(--ink)}
.dots i.d{background:var(--good)}
.dots i.n{background:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.opt{background:var(--t);border:3px solid var(--c);border-radius:18px;padding:6px;min-width:0;box-shadow:0 4px 0 var(--c)}
.opt svg{width:100%;height:auto;display:block}
.opt.right{background:var(--good);border-color:var(--good);box-shadow:0 4px 0 var(--good);animation:pop .4s}
.opt.wrong{border-color:var(--bad);animation:shake .4s}
.shake{animation:shake .4s}
.hint{animation:pulse .8s infinite alternate}
.msg{font-family:var(--f-display);font-weight:800;font-size:1.8rem;color:var(--good);min-height:1.9rem;margin:0}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tile.used{visibility:hidden}
.big{font-family:var(--f-display);font-weight:800;font-size:3rem}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 1.8s ease-in forwards}

@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{to{transform:scale(1.14)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.lead{font-size:1.7rem}.ask{font-size:1.6rem}.top h1{font-size:1.2rem}}
</style>

<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="iconbtn" id="homeBtn" aria-label="Back to home" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1>Computer Parts</h1>
    <div class="stars" aria-label="Stars won">
      <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" fill="#FFC21A" stroke="#15264D" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span id="starCount">0</span>
    </div>
  </header>

  <main>
    <section id="home" class="wrap">
      <p class="lead">Let's learn the parts!</p>
      <p class="sub">Pick a game. Tap the speaker to hear the words.</p>
      <div class="modes" id="modes"></div>
      <h2 style="font-size:1.4rem">The 6 parts</h2>
      <div class="strip" id="strip"></div>
    </section>

    <section id="learn" class="wrap" hidden>
      <div class="stage" id="learnStage">
        <div class="pic" id="learnPic"></div>
        <div class="word" id="learnWord"></div>
        <p class="say" id="learnSay"></p>
        <div class="row">
          <button class="btn main" id="learnHear"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9z"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Say it</button>
          <button class="btn" id="learnSpell">Spell it</button>
        </div>
        <div class="row">
          <button class="btn" id="learnPrev" aria-label="Previous part">&larr; Back</button>
          <button class="btn" id="learnNext" aria-label="Next part">Next &rarr;</button>
        </div>
        <div class="thumbs" id="thumbs"></div>
      </div>
    </section>

    <section id="find" class="wrap" hidden>
      <div class="stage">
        <div class="dots" id="findDots"></div>
        <div class="ask" id="findAsk"></div>
        <button class="btn" id="findHear"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9z"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Hear it</button>
        <div class="opts" id="findOpts"></div>
        <p class="msg" id="findMsg"></p>
      </div>
    </section>

    <section id="spell" class="wrap" hidden>
      <div class="stage">
        <div class="dots" id="spellDots"></div>
        <div class="pic" id="spellPic"></div>
        <div class="slots" id="slots"></div>
        <div class="tiles" id="tiles"></div>
        <p class="msg" id="spellMsg"></p>
        <div class="row">
          <button class="btn" id="spellHear">Say it</button>
          <button class="btn" id="spellHint">Show me</button>
          <button class="btn main" id="spellNext" hidden>Next &rarr;</button>
        </div>
      </div>
    </section>

    <section id="done" class="wrap" hidden>
      <div class="stage">
        <div class="big">Great job!</div>
        <p class="say" id="doneText"></p>
        <div class="row">
          <button class="btn main" id="doneAgain">Play again</button>
          <button class="btn" id="doneHome">Home</button>
        </div>
      </div>
    </section>
  </main>
</div>
<div id="confetti" aria-hidden="true"></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var W=function(label,inner){return '<svg viewBox="0 0 200 150" role="img" aria-label="'+label+'">'+inner+'</svg>'};
  var keys='';
  for(var r=0;r<3;r++){for(var k=0;k<12;k++){keys+='<rect x="'+(18+k*14.2)+'" y="'+(50+r*18)+'" width="12" height="14" rx="3" fill="#FFF3C4"/>'}}
  var P=[
    {id:'computer',name:'Computer',c:'#3F6FFF',t:'#DCE6FF',say:'A computer helps us learn and play.',
     svg:W('A computer','<rect x="32" y="12" width="136" height="90" rx="9" fill="#26335F"/><rect x="40" y="20" width="120" height="74" rx="4" fill="#CFE0FF"/><rect x="48" y="28" width="46" height="26" rx="3" fill="#fff"/><rect x="100" y="28" width="52" height="8" rx="3" fill="#7FA2FF"/><rect x="100" y="42" width="40" height="8" rx="3" fill="#7FA2FF"/><rect x="48" y="60" width="104" height="26" rx="3" fill="#9DB9FF"/><path d="M8 108H192L183 131Q182 135 177 135H23Q18 135 17 131Z" fill="#8FA6E8"/><rect x="80" y="108" width="40" height="7" rx="3.5" fill="#6C85CC"/>')},
    {id:'cpu',name:'CPU',c:'#FF7A59',t:'#FFE1D8',say:'The CPU is the brain of the computer.',
     svg:W('A CPU box','<rect x="56" y="8" width="88" height="134" rx="9" fill="#4B4F6B"/><rect x="70" y="24" width="60" height="10" rx="3" fill="#22243A"/><rect x="70" y="40" width="60" height="10" rx="3" fill="#22243A"/><circle cx="100" cy="76" r="11" fill="#3DDC97" stroke="#22243A" stroke-width="3"/><g stroke="#9096B8" stroke-width="4" stroke-linecap="round"><path d="M74 104H126"/><path d="M74 114H126"/><path d="M74 124H126"/></g>')},
    {id:'monitor',name:'Monitor',c:'#12A58A',t:'#D3F4EC',say:'The monitor shows us pictures.',
     svg:W('A monitor','<rect x="16" y="10" width="168" height="98" rx="9" fill="#22305A"/><rect x="24" y="18" width="152" height="82" rx="4" fill="#BFF2E6"/><circle cx="62" cy="44" r="12" fill="#FFD84D"/><path d="M24 100V76Q60 54 96 76T176 70V100Z" fill="#3DBE8E"/><rect x="91" y="108" width="18" height="18" fill="#4B5A86"/><rect x="60" y="124" width="80" height="12" rx="6" fill="#4B5A86"/>')},
    {id:'keyboard',name:'Keyboard',c:'#E8A200',t:'#FFF0C2',say:'The keyboard has keys. We type with it.',
     svg:W('A keyboard','<rect x="8" y="38" width="184" height="90" rx="12" fill="#3A4468"/>'+keys+'<rect x="48" y="106" width="104" height="14" rx="4" fill="#FFF3C4"/>')},
    {id:'mouse',name:'Mouse',c:'#9B55F0',t:'#EBDAFF',say:'The mouse helps us click.',
     svg:W('A mouse','<path d="M100 40C100 14 150 26 150 4" fill="none" stroke="#3A4468" stroke-width="4" stroke-linecap="round"/><ellipse cx="100" cy="90" rx="40" ry="54" fill="#6B3FB8"/><path d="M60 84H140M100 38V84" stroke="#EBDAFF" stroke-width="4" fill="none"/><rect x="94" y="50" width="12" height="22" rx="6" fill="#EBDAFF"/>')},
    {id:'speakers',name:'Speakers',c:'#EB3F85',t:'#FFD9E8',say:'Speakers let us hear sounds.',
     svg:W('Two speakers','<rect x="14" y="14" width="76" height="122" rx="10" fill="#4A2A4E"/><rect x="110" y="14" width="76" height="122" rx="10" fill="#4A2A4E"/><circle cx="52" cy="42" r="11" fill="#FFB3D1"/><circle cx="148" cy="42" r="11" fill="#FFB3D1"/><circle cx="52" cy="94" r="26" fill="#FFB3D1"/><circle cx="148" cy="94" r="26" fill="#FFB3D1"/><circle cx="52" cy="94" r="10" fill="#4A2A4E"/><circle cx="148" cy="94" r="10" fill="#4A2A4E"/>')}
  ];
  var byId={};P.forEach(function(p){byId[p.id]=p});

  /* stars */
  var stars=0;try{stars=+localStorage.getItem('cps-stars')||0}catch(e){}
  function addStar(){stars++;$('#starCount').textContent=stars;try{localStorage.setItem('cps-stars',stars)}catch(e){}}
  $('#starCount').textContent=stars;

  /* sound + voice */
  var ac;
  function tone(f,d,t,type,v){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+(t||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
  function good(){tone(523,.15);tone(659,.15,.12);tone(784,.3,.24)}
  function bad(){tone(200,.25,0,'triangle',.12)}
  function say(text,rate,keep){try{var s=window.speechSynthesis;if(!s)return;if(!keep)s.cancel();var u=new SpeechSynthesisUtterance(text);u.rate=rate||.85;u.lang='en-IN';s.speak(u)}catch(e){}}
  function confetti(){
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    var box=$('#confetti'),cols=['#3F6FFF','#FF7A59','#12A58A','#FFC21A','#9B55F0','#EB3F85'];
    for(var i=0;i<28;i++){var e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cols[i%6];e.style.animationDelay=Math.random()*.4+'s';box.appendChild(e);(function(x){setTimeout(function(){x.remove()},2400)})(e)}
  }
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function vars(p){return '--c:'+p.c+';--t:'+p.t}

  /* navigation */
  var screens=['home','learn','find','spell','done'],current='home';
  function show(id){
    current=id;
    screens.forEach(function(s){$('#'+s).hidden=(s!==id)});
    $('#homeBtn').hidden=(id==='home');
    try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
    window.scrollTo(0,0);
  }
  $('#homeBtn').onclick=function(){show('home')};
  $('#doneHome').onclick=function(){show('home')};

  /* home */
  var modeInfo=[
    {go:'learn',title:'Look & listen',sub:'Meet each part. Hear it. Spell it.',p:byId.monitor},
    {go:'find',title:'Find it',sub:'Tap the right picture.',p:byId.mouse},
    {go:'spell',title:'Spell it',sub:'Tap the letters in order.',p:byId.keyboard}
  ];
  $('#modes').innerHTML=modeInfo.map(function(m){
    return '<button class="mode" data-go="'+m.go+'" style="'+vars(m.p)+'">'+m.p.svg+'<h2>'+m.title+'</h2><span>'+m.sub+'</span></button>';
  }).join('');
  $('#strip').innerHTML=P.map(function(p){return '<div class="chip">'+p.svg+'<span>'+p.name+'</span></div>'}).join('');
  $('#modes').addEventListener('click',function(e){
    var b=e.target.closest('[data-go]');if(!b)return;
    var g=b.getAttribute('data-go');
    tone(660,.1);
    if(g==='learn')startLearn();else if(g==='find')startFind();else startSpell();
  });

  /* learn */
  var li=0,spelling=false;
  function renderLearn(){
    var p=P[li];
    var st=$('#learnStage');st.setAttribute('style',vars(p));
    $('#learnPic').innerHTML=p.svg;
    $('#learnWord').innerHTML=p.name.toUpperCase().split('').map(function(ch){return '<span class="tile">'+ch+'</span>'}).join('');
    $('#learnSay').textContent=p.say;
    $('#thumbs').innerHTML=P.map(function(q,i){
      return '<button class="thumb" data-i="'+i+'" style="'+vars(q)+'" aria-label="'+q.name+'"'+(i===li?' aria-current="true"':'')+'>'+q.svg+'</button>';
    }).join('');
  }
  function startLearn(){li=0;show('learn');renderLearn();say(P[0].name)}
  function goLearn(i){li=(i+P.length)%P.length;renderLearn();say(P[li].name+'. '+P[li].say)}
  $('#learnHear').onclick=function(){say(P[li].name+'. '+P[li].say)};
  $('#learnPrev').onclick=function(){goLearn(li-1)};
  $('#learnNext').onclick=function(){goLearn(li+1)};
  $('#thumbs').addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(b)goLearn(+b.getAttribute('data-i'))});
  $('#learnSpell').onclick=function(){
    if(spelling)return;spelling=true;
    var tiles=document.querySelectorAll('#learnWord .tile'),word=P[li].name.toUpperCase();
    try{speechSynthesis.cancel()}catch(e){}
    for(var i=0;i<tiles.length;i++){(function(i){setTimeout(function(){
      tiles.forEach&&tiles.forEach(function(t){t.classList.remove('on')});
      if(tiles[i]){tiles[i].classList.add('on');say(word[i],.7,true);tone(440+i*60,.12)}
    },i*800)})(i)}
    setTimeout(function(){tiles.forEach(function(t){t.classList.remove('on')});say(P[li].name,.8,true);spelling=false},tiles.length*800+200);
  };

  /* find it */
  var fOrder,fIdx,fLock,fScore;
  function dots(el,total,done){
    var h='';for(var i=0;i<total;i++)h+='<i class="'+(i<done?'d':(i===done?'n':''))+'"></i>';
    $(el).innerHTML=h;
  }
  function startFind(){fOrder=shuffle(P);fIdx=0;fScore=0;show('find');renderFind()}
  function renderFind(){
    fLock=false;$('#findMsg').textContent='';
    var t=fOrder[fIdx];
    dots('#findDots',P.length,fIdx);
    $('#findAsk').innerHTML='Tap the <b>'+t.name.toUpperCase()+'</b>';
    var others=shuffle(P.filter(function(p){return p.id!==t.id})).slice(0,2);
    var opts=shuffle([t].concat(others));
    $('#findOpts').innerHTML=opts.map(function(p){return '<button class="opt" data-id="'+p.id+'" style="'+vars(p)+'" aria-label="'+p.name+'">'+p.svg+'</button>'}).join('');
    say('Tap the '+t.name);
  }
  $('#findHear').onclick=function(){say('Tap the '+fOrder[fIdx].name)};
  $('#findOpts').addEventListener('click',function(e){
    var b=e.target.closest('.opt');if(!b||fLock)return;
    var t=fOrder[fIdx];
    if(b.getAttribute('data-id')===t.id){
      fLock=true;b.classList.add('right');good();addStar();fScore++;
      $('#findMsg').textContent='Yes! '+t.name;say('Yes! '+t.name);
      setTimeout(function(){
        fIdx++;
        if(fIdx>=fOrder.length)finish('find');else renderFind();
      },1500);
    }else{
      b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');bad();
      $('#findMsg').textContent='';say('Try again');
    }
  });

  /* spell it */
  var sOrder,sIdx,sWord,sPos;
  function startSpell(){sOrder=shuffle(P);sIdx=0;show('spell');renderSpell()}
  function renderSpell(){
    var p=sOrder[sIdx];sWord=p.name.toUpperCase();sPos=0;
    dots('#spellDots',P.length,sIdx);
    $('#spellPic').setAttribute('style',vars(p));$('#spellPic').innerHTML=p.svg;
    $('#spellMsg').textContent='';$('#spellNext').hidden=true;$('#spellHint').hidden=false;
    var sl='';for(var i=0;i<sWord.length;i++)sl+='<div class="slot"></div>';
    $('#slots').innerHTML=sl;
    var letters=sWord.split(''),mixed=shuffle(letters),tries=0;
    while(mixed.join('')===sWord&&tries++<10)mixed=shuffle(letters);
    $('#tiles').innerHTML=mixed.map(function(ch,i){return '<button class="tile" data-l="'+ch+'" style="'+vars(p)+'" aria-label="Letter '+ch+'">'+ch+'</button>'}).join('');
    say('Spell '+p.name);
  }
  $('#spellHear').onclick=function(){say(sOrder[sIdx].name)};
  $('#spellHint').onclick=function(){
    var ts=document.querySelectorAll('#tiles .tile:not(.used)');
    for(var i=0;i<ts.length;i++){ts[i].classList.remove('hint');if(ts[i].getAttribute('data-l')===sWord[sPos]){ts[i].classList.add('hint');break}}
  };
  $('#tiles').addEventListener('click',function(e){
    var b=e.target.closest('.tile');if(!b||b.classList.contains('used')||sPos>=sWord.length)return;
    var l=b.getAttribute('data-l');
    if(l===sWord[sPos]){
      var slot=document.querySelectorAll('#slots .slot')[sPos];
      slot.textContent=l;slot.classList.add('full');slot.setAttribute('style',vars(sOrder[sIdx]));
      b.classList.remove('hint');b.classList.add('used');
      document.querySelectorAll('#tiles .hint').forEach(function(h){h.classList.remove('hint')});
      tone(500+sPos*50,.12);say(l,.8);sPos++;
      if(sPos===sWord.length){
        setTimeout(function(){
          good();addStar();confetti();
          $('#spellMsg').textContent='You spelled '+sOrder[sIdx].name+'!';
          say('You spelled '+sOrder[sIdx].name);
          $('#spellNext').hidden=false;$('#spellHint').hidden=true;
        },350);
      }
    }else{
      b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');bad();
    }
  });
  $('#spellNext').onclick=function(){sIdx++;if(sIdx>=sOrder.length)finish('spell');else renderSpell()};

  /* done */
  var lastMode='find';
  function finish(mode){
    lastMode=mode;show('done');good();confetti();
    $('#doneText').textContent=mode==='find'?'You found all 6 parts!':'You spelled all 6 parts!';
    say('Great job! '+$('#doneText').textContent);
  }
  $('#doneAgain').onclick=function(){lastMode==='find'?startFind():startSpell()};
})();
</script>

</body>
</html>
